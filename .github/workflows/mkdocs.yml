# Image path resolver: course-relative Windows paths supported.
name: Deploy current replicated course
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Synchronize source from Forge']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: E-LePrettre/E-LePrettre.github.io
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'mkdocs-material>=8,<9' mkdocs-awesome-pages-plugin mkdocs-macros-plugin mkdocs-enumerate-headings-plugin
      - name: Build current source and verify image paths
        run: python scripts/replicate.py
        env:
          REPLICATE_PROJECT: nsi-tle
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/nsi-tle
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
