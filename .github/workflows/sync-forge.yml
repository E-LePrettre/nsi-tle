name: Synchronize source from Forge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-forge.yml']
  workflow_dispatch:
  schedule:
    - cron: '13 3 * * *'
permissions:
  contents: write
concurrency:
  group: sync-forge
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Retrieve current Forge source
        run: git clone --depth 1 https://forge.apps.education.fr/eleprettre/nsi-tle.git "$RUNNER_TEMP/forge-source"
      - name: Synchronize files and preserve GitHub workflows
        run: |
          source_revision=$(git -C "$RUNNER_TEMP/forge-source" rev-parse HEAD)
          rsync -a --delete --exclude=.git/ --exclude=.github/ "$RUNNER_TEMP/forge-source/" ./
          printf '%s\n' "$source_revision" > .forge-revision
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize Forge source $source_revision"
            git push origin HEAD:main
          fi
